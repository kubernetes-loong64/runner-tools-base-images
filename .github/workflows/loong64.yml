name: loong64
on:
  push:
    branches:
      - loong64-*
    tags:
      - release-loong64-*
  pull_request:
    branches:
      - loong64-*

env:
  KUBE_BASE_IMAGE_REGISTRY: ${{ vars.KUBE_BASE_IMAGE_REGISTRY || 'kubernetesloong64' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:13
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Print branch name
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.base_ref }} (PR target)"
          else
            echo ${{ github.ref_name }}
          fi
      - name: Extract base-images branch
        id: extract
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF=${{ github.base_ref }}
          else
            REF=${{ github.ref_name }}
          fi
          echo "REF=$REF"
          RAW_VERSION=$(echo $REF | awk -F'loong64-' '{print $2}')
          echo "RAW_VERSION=$RAW_VERSION"
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_ENV}
          echo "RAW_VERSION=$RAW_VERSION" >> ${GITHUB_OUTPUT}
          RUNNER_HELPER_BRANCH=$(echo $RAW_VERSION | awk -F'+' '{print $1}')
          echo "RUNNER_HELPER_BRANCH=$RUNNER_HELPER_BRANCH"
          echo "RUNNER_HELPER_BRANCH=$RUNNER_HELPER_BRANCH" >> ${GITHUB_ENV}
          echo "RUNNER_HELPER_BRANCH=$RUNNER_HELPER_BRANCH" >> ${GITHUB_OUTPUT}
          RELEASE=$(echo $RAW_VERSION | awk -F'+' '{print $2}')
          RELEASE=${RELEASE:-alpha.${{ github.run_number }}}
          echo "RELEASE=$RELEASE"
          echo "RELEASE=$RELEASE" >> ${GITHUB_ENV}
          echo "RELEASE=$RELEASE" >> ${GITHUB_OUTPUT}
          if echo "$RAW_VERSION" | grep -qE '[+].*(alpha|beta|rc)'; then
            IS_STABLE=false
          else
            IS_STABLE=true
          fi
          echo "IS_STABLE=$IS_STABLE"
          echo "IS_STABLE=$IS_STABLE" >> ${GITHUB_OUTPUT}
      - name: Install build tools
        run: |
          apt update
          apt install -y git make golang file jq
      - name: Clone base-images
        run: |
          git clone --branch ${{ env.RUNNER_HELPER_BRANCH }} --depth 1 https://gitlab.com/gitlab-org/ci-cd/runner-tools/base-images.git base-images
      - name: ls
        run: ls -lah
      - name: Install Docker CLI
        run: |
          apt remove $(dpkg --get-selections docker.io docker-compose docker-doc podman-docker containerd runc | cut -f1)
          apt update
          apt install -y ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          # Add the repository to Apt sources:
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/debian
          Suites: $(. /etc/os-release && echo "$VERSION_CODENAME")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt update
          apt install -y docker-ce-cli
      - name: Verify Docker installation
        run: |
          ls -la /run/docker.sock 2>/dev/null || echo "/run/docker.sock not found"
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker info
      - name: Apply patches
        working-directory: base-images
        run: git apply ../*.patch
      - name: Install QEMU binfmt for loong64
        run: |
          docker run --privileged --rm ghcr.io/loong64/binfmt --install all
      - name: Build base-images
        working-directory: base-images
        env:
          PLATFORM: "*.platform=linux/loong64"
          OUTPUT: "*.output=type=docker,rewrite-timestamp=true"
        run: |
          echo "=== Docker images before build ==="
          docker images
          echo "=== Build helper-ubuntu (debian base image for loong64) ==="
          make helper-ubuntu
          echo "=== Build helper-ubuntu completed ==="
          echo "=== Docker images after helper-ubuntu ==="
          docker images
          IMAGE_REF=${{ env.KUBE_BASE_IMAGE_REGISTRY }}/runner-tools-base-images:${{ env.RUNNER_HELPER_BRANCH }}-debian
          echo "IMAGE_REF=$IMAGE_REF"
          echo "IMAGE_REF=$IMAGE_REF" >> ${GITHUB_ENV}
          docker tag local/runner-helper:latest-ubuntu $IMAGE_REF
          docker images
          echo "=== Saving $IMAGE_REF ==="
          docker save -o base-images-loong64.tar $IMAGE_REF
          echo "=== Image tarball ==="
          ls -lha base-images-loong64.tar
          echo "=== Manifest ==="
          echo "--- repositories ---"
          tar -xOf base-images-loong64.tar repositories
          echo "--- manifest.json ---"
          tar -xOf base-images-loong64.tar manifest.json | jq
          echo "--- config ---"
          tar -xOf base-images-loong64.tar $(tar -xOf base-images-loong64.tar manifest.json | jq -r '.[0].Config') | jq
          echo "--- os, architecture ---"
          tar -xOf base-images-loong64.tar $(tar -xOf base-images-loong64.tar manifest.json | jq -r '.[0].Config') | jq '{os, architecture}'
      - name: Upload base-images image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-helper-loong64-images
          path: base-images/base-images-loong64.tar
      - name: Login to Docker
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push image
        run: docker push $IMAGE_REF
